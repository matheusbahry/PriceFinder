# -----------------------------------------------------------------------
# URLS - BASE (usadas no WebClientConfig como baseUrl)
# -----------------------------------------------------------------------
resend.URL=https://api.resend.com
mbl.website=https://api.mercadolibre.com
ebay.website=https://api.ebay.com

# -----------------------------------------------------------------------
# URLS - MERCADO LIVRE (paths relativos ao mbl.website)
# -----------------------------------------------------------------------
mbl.search=/sites/MLB/search
mbl.itens=/items/{id}
mbl.users=/users/{id}
# URL absoluta: o token OAuth do ML usa domínio diferente do baseUrl
mlb.auth-token=https://api.mercadolibre.com/oauth/token

# -----------------------------------------------------------------------
# URLS - EBAY (paths relativos ao ebay.website = https://api.ebay.com)
# auth-token: endpoint OAuth de geração de token por client_credentials
# auth-scope: escopo de acesso passado no body da requisição de token
# buy-search: endpoint de busca de produtos
# browse-iten: endpoint de detalhe de produto por ID
# -----------------------------------------------------------------------
ebay.url.auth-token=/identity/v1/oauth2/token
ebay.url.auth-scope=https://api.ebay.com/oauth/api_scope
ebay.url.buy-search=/buy/browse/v1/item_summary/search
ebay.url.browse-iten=/buy/browse/v1/item/